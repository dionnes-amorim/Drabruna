<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Admin Ouvidoria - Delipack</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#0B2A4A;--verde:#00C896} *{margin:0;padding:0;box-sizing:border-box} body{font-family:Inter;background:#F2F5F8}
header{background:linear-gradient(135deg,var(--azul),#123c6a);color:white;padding:14px 4%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;width:100%;flex-wrap:wrap;gap:10px}
header b{font-size:14px;letter-spacing:.5px}
#login{height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#0B2A4A,#123c6a);padding:20px}
.box{background:white;padding:28px;border-radius:18px;width:100%;max-width:360px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1.5px solid #ddd;margin:6px 0;outline:none;font-size:14px}
.btn{background:var(--azul);color:white;padding:13px;border:none;border-radius:10px;width:100%;font-weight:700;cursor:pointer}
.container{padding:16px 3%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{background:white;border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.kpi{font-size:26px;font-weight:800;color:var(--azul)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input{flex:1;min-width:200px}
.filters select{min-width:160px;width:auto}
.table-wrap{background:white;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.05);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}
th{background:var(--azul);color:white;font-size:11px;letter-spacing:.6px;text-transform:uppercase;position:sticky;top:0}
td{white-space:normal;vertical-align:top}
.btn-resp{padding:8px 14px;border-radius:20px;border:none;background:var(--azul);color:white;font-weight:700;cursor:pointer;font-size:12px}
.cards{display:none;grid-template-columns:1fr;gap:12px}
.card-relato{background:white;border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.05);border-left:5px solid var(--azul)}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
.Novo{background:#FFF4CC}.Em{background:#D6E8FF}.Respondido{background:#D1FAE5}.Concluído{background:#c8f7c5}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);justify-content:center;align-items:center;z-index:99;padding:16px}
.modal-box{background:white;padding:22px;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
@media(max-width:900px){
 .kpis{grid-template-columns:1fr 1fr}
 .table-wrap{display:none}
 .cards{display:grid}
}
</style>
</head><body>

<div id="login"><div class="box"><h2 style="color:var(--azul)">Ouvidoria Delipack</h2><p style="font-size:12px;color:#666;margin:6px 0 14px">Acesso restrito ao comitê</p><input id="u" placeholder="admin@delipack.com.br" value="admin@delipack.com.br"><input id="p" type="password" placeholder="senha do Render"><button class="btn" id="btnLogin" onclick="logar()">Entrar no painel</button><p id="erro" style="color:red;font-size:12px;margin-top:8px"></p></div></div>

<div id="app" style="display:none">
<header><b>DELIPACK • OUVIDORIA</b><div style="display:flex;gap:8px"><button onclick="exportar()" style="padding:9px 14px;border-radius:10px;border:none;background:white;color:var(--azul);font-weight:800;cursor:pointer;font-size:12px">Exportar</button><button onclick="sair()" style="padding:9px 14px;border-radius:10px;border:none;background:rgba(255,255,255,.2);color:white;cursor:pointer;font-size:12px">Sair</button></div></header>

<div class="container">
<div class="kpis">
<div class="card"><div style="font-size:10px;color:#666">TOTAL</div><div class="kpi" id="kpiTotal">0</div></div>
<div class="card"><div style="font-size:10px;color:#666">ANÔNIMOS</div><div class="kpi" id="kpiAnon">0</div></div>
<div class="card"><div style="font-size:10px;color:#666">NOVOS</div><div class="kpi" id="kpiNovos">0</div></div>
<div class="card"><div style="font-size:10px;color:#666">CONCLUÍDOS</div><div class="kpi" id="kpiResp">0</div></div>
</div>

<div class="filters">
<input id="busca" placeholder="🔍 Buscar por tipo, nome, descrição..." oninput="render()">
<select id="fTipo" onchange="render()"><option value="">Todos os tipos</option><option>Denúncia</option><option>Reclamação</option><option>Assédio Moral / Sexual</option><option>Sugestão</option><option>Elogio</option><option>Dúvida</option></select>
</div>

<div class="table-wrap"><table><thead><tr><th>Data/Hora</th><th>Tipo</th><th>Anônimo?</th><th>Identificação</th><th>Gravidade</th><th>Local</th><th>Relato</th><th>Ação</th></tr></thead><tbody id="tbody"></tbody></table></div>

<div class="cards" id="cards"></div>
</div>
</div>

<div class="modal" id="modal"><div class="modal-box">
<h3 style="color:var(--azul)">Responder / Ação tomada</h3>
<div style="background:#f9fafb;padding:12px;border-radius:10px;font-size:13px;margin:10px 0" id="modalInfo"></div>
<label style="font-size:11px;font-weight:800">O que foi feito?</label><textarea id="acao" rows="4"></textarea>
<label style="font-size:11px;font-weight:800;margin-top:8px;display:block">Parecer interno</label><textarea id="parecer" rows="3"></textarea>
<label style="font-size:11px;font-weight:800">Status final</label><select id="statusFinal"><option>Novo</option><option>Em Análise</option><option>Respondido</option><option>Concluído</option><option>Arquivado</option></select>
<button class="btn" style="margin-top:10px" onclick="salvarResposta()">Salvar resposta</button>
<button onclick="fechar()" style="margin-top:8px;width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;background:white;cursor:pointer">Cancelar</button>
</div></div>

<script>
let lista=[], idAtivo=null, token=localStorage.getItem('delipack_token');

async function logar(){
  const btn=document.getElementById('btnLogin');
  const erro=document.getElementById('erro');
  btn.textContent='Entrando...'; btn.disabled=true; erro.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('u').value.trim(),password:document.getElementById('p').value})});
    const j=await r.json();
    if(!r.ok){ erro.textContent=j.error||'Login inválido'; btn.textContent='Entrar no painel'; btn.disabled=false; return; }
    token=j.token; localStorage.setItem('delipack_token',token);
    mostrar();
  }catch(e){
    erro.textContent='Servidor acordando... aguarde 20s e tente de novo';
    btn.textContent='Entrar no painel'; btn.disabled=false;
  }
}
function mostrar(){ document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; carregar(); }

async function carregar(){
  try{
    const r=await fetch('/api/relatos',{headers:{Authorization:'Bearer '+token}});
    if(!r.ok){ sair(); return; }
    lista=await r.json();
    render();
  }catch(e){}
}

function render(){
 let l=[...lista];
 let q=document.getElementById('busca').value.toLowerCase(), ft=document.getElementById('fTipo').value;
 if(q) l=l.filter(x=> JSON.stringify(x).toLowerCase().includes(q));
 if(ft) l=l.filter(x=> x.tipo==ft);

 document.getElementById('kpiTotal').textContent=lista.length;
 document.getElementById('kpiAnon').textContent=lista.filter(x=>x.anonimo).length;
 document.getElementById('kpiNovos').textContent=lista.filter(x=>x.status=='Novo').length;
 document.getElementById('kpiResp').textContent=lista.filter(x=>['Respondido','Concluído'].includes(x.status)).length;

 const tbody=document.getElementById('tbody'); const cards=document.getElementById('cards');
 tbody.innerHTML=''; cards.innerHTML='';
 l.forEach(r=>{
  let descCurta = (r.descricao||'').substring(0,90);
  let respondido = r.resposta_admin ? '<br><span style="color:green;font-size:11px">✅ Respondido</span>' : '';
  tbody.innerHTML += '<tr><td>'+(r.data_br||'')+'</td><td><b>'+r.tipo+'</b></td><td>'+(r.anonimo?'🕵️ Anônimo':'🙋 '+r.nome)+'</td><td>'+(r.setor||'')+'</td><td>'+(r.gravidade||'-')+'</td><td>'+(r.local||'-')+'</td><td style="max-width:200px">'+descCurta+'... '+respondido+'</td><td><button class="btn-resp" onclick="abrir(\''+r.id+'\')">Responder</button></td></tr>';

  let badge = r.status || 'Novo';
  let acaoTxt = '';
  if(r.resposta_admin){
    acaoTxt = '<small style="color:green"><b>Acao:</b> '+(r.acao_tomada||'')+'<br><b>Parecer:</b> '+r.resposta_admin+'</small>';
  }
  cards.innerHTML += '<div class="card-relato"><div style="display:flex;justify-content:space-between;font-size:12px"><span><b>'+r.tipo+'</b> • '+(r.data_br||'')+'</span><span class="badge '+badge+'">'+badge+'</span></div><div style="display:flex;justify-content:space-between;margin:6px 0;font-size:12px"><span>👤 '+(r.anonimo?'Anônimo':r.nome)+'</span><span>📍 '+(r.local||'-')+'</span></div><div style="font-size:12px">⚠️ '+(r.gravidade||'-')+' • '+(r.setor||'')+'</div><div style="background:#f9fafb;padding:10px;border-radius:10px;font-size:13px;margin:8px 0">'+(r.descricao||'')+'<br>'+acaoTxt+'</div><button class="btn-resp" style="width:100%" onclick="abrir(\''+r.id+'\')">Responder</button></div>';
 });
}

function abrir(id){ idAtivo=id; let r=lista.find(x=>x.id==id); document.getElementById('modalInfo').innerHTML='<b>'+r.tipo+' - '+(r.data_br||'')+'</b><br>'+(r.nome||'')+' - '+(r.setor||'')+'<br><br>'+(r.descricao||''); document.getElementById('acao').value=r.acao_tomada||''; document.getElementById('parecer').value=r.resposta_admin||''; document.getElementById('statusFinal').value=r.status||'Novo'; document.getElementById('modal').style.display='flex'; }
function fechar(){ document.getElementById('modal').style.display='none'; }

async function salvarResposta(){
 const r=await fetch('/api/relatos/'+idAtivo,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({acao_tomada:document.getElementById('acao').value,resposta_admin:document.getElementById('parecer').value,status:document.getElementById('statusFinal').value,data_resposta:new Date().toLocaleString('pt-BR')})});
 if(!r.ok){ alert('Erro ao salvar'); return; }
 fechar(); carregar();
}

function exportar(){
 let csv='Data,Tipo,Nome,Setor,Gravidade,Local,Descricao,Status,Acao,Parecer\n';
 lista.forEach(r=>{ csv+='"'+(r.data_br||'')+'","'+r.tipo+'","'+r.nome+'","'+r.setor+'","'+r.gravidade+'","'+r.local+'","'+(r.descricao||'').replace(/"/g,'""')+'","'+r.status+'","'+(r.acao_tomada||'').replace(/"/g,'""')+'","'+(r.resposta_admin||'').replace(/"/g,'""')+'"\n'; });
 let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ouvidoria-delipack.csv'; a.click();
}
function sair(){ localStorage.removeItem('delipack_token'); location.reload(); }
if(token){ mostrar(); }
</script>
</body></html>
