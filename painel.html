<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Gerencial - Dra Bruna</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
:root{--vinho:#6A1B2A} *{margin:0;padding:0;box-sizing:border-box}
body{font-family:Montserrat;background:#FFF8F5}
#login{height:100vh;display:flex;justify-content:center;align-items:center}
.box-login{background:white;padding:40px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.1);width:360px;text-align:center;border-top:6px solid var(--vinho)}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:8px 0}
.btn{background:var(--vinho);color:white;padding:12px;width:100%;border:none;border-radius:30px;cursor:pointer;font-weight:600;margin-top:10px}
#app{display:none}
header{background:white;padding:16px 4%;display:flex;justify-content:space-between;border-bottom:1px solid #eee}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:20px} th,td{padding:10px;border-bottom:1px solid #eee} th{background:var(--vinho);color:white}
.card{background:white;margin:20px 4%;padding:20px;border-radius:18px}
.tag{padding:4px 10px;border-radius:20px;font-size:11px;background:#e8ffe8}.tag.cancel{background:#ffdddd;color:#900}
</style>
</head><body>

<div id="login">
<div class="box-login">
<h2 style="font-family:Cormorant Garamond;color:#6A1B2A">Acesso Restrito</h2><p style="font-size:12px;color:#777;margin:8px 0 14px">Painel Dra. Bruna Giacomazzi</p>
<input id="user" placeholder="Usuário (leticia)"><input id="pass" type="password" placeholder="Senha">
<button class="btn" onclick="logar()">Entrar</button><p id="erro" style="color:red;font-size:12px;margin-top:8px"></p>
</div>
</div>

<div id="app">
<header><b style="color:var(--vinho)">DRA. BRUNA • GERENCIAL</b><div><button class="btn" style="width:auto;padding:8px 16px" onclick="location.href='cliente.html'" target="_blank">Ver página do cliente</button> <button class="btn" style="width:auto;padding:8px 16px;background:#111" onclick="sair()">Sair</button></div></header>
<div class="card">
<h2>Agendamentos Confirmados - Seg a Sex 08:00 às 17:00 (30min)</h2>
<p style="font-size:12px;color:#666">Quando cancela aqui, o horário volta a ficar livre no chat do cliente automaticamente.</p>
<table id="tab"><thead><tr><th>Data/Hora</th><th>CPF</th><th>Nome</th><th>Serviço</th><th>Status</th><th>Ação</th></tr></thead><tbody></tbody></table>
</div>
</div>

<script>
const KEY="bg_agenda_v2";
function get(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function save(a){localStorage.setItem(KEY,JSON.stringify(a)); render()}
function logar(){
 if(document.getElementById('user').value.toLowerCase()=='leticia' && document.getElementById('pass').value=='bruna2026'){
  localStorage.setItem('bg_login','ok'); mostrar();
 } else { document.getElementById('erro').textContent='Usuário ou senha errada'; }
}
function mostrar(){
 document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; render();
}
function sair(){ localStorage.removeItem('bg_login'); location.reload(); }
function render(){
 const tb=document.querySelector('#tab tbody'); const ag=get().sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
 tb.innerHTML=''; if(ag.length==0) tb.innerHTML='<tr><td colspan=6>Nenhum agendamento</td></tr>';
 ag.forEach(a=>{
  tb.innerHTML+=`<tr><td><b>${a.data.split('-').reverse().join('/')} ${a.hora}</b></td><td>${a.cpf}</td><td>${a.nome}</td><td>${a.servico}</td><td><span class="tag ${a.status=='cancelado'?'cancel':''}">${a.status}</span></td><td>${a.status!='cancelado'?`<button onclick="cancelar('${a.cpf}','${a.data}','${a.hora}')">Cancelar</button>`:'-'}</td></tr>`;
 });
}
function cancelar(cpf,data,hora){ let ag=get(); let i=ag.findIndex(x=>x.cpf==cpf&&x.data==data&&x.hora==hora&&x.status!='cancelado'); if(i>=0){ ag[i].status='cancelado'; save(ag); } }
if(localStorage.getItem('bg_login')=='ok') mostrar();
</script>
</body></html>
