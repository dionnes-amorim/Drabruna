<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ouvidoria Delipack</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>:root{--azul:#0B2A4A;--verde:#00C896}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter;background:#F5F7FA}
.top{background:rgba(255,255,255,.9);backdrop-filter:blur(12px);padding:14px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #eee;position:sticky;top:0}
.logo{font-weight:800;color:var(--azul);font-size:22px}.logo span{color:var(--verde)}
.hero{background:linear-gradient(135deg,var(--azul),#123c6a);color:white;padding:60px 5%;display:grid;grid-template-columns:1.2fr.8fr;gap:20px}
.form-wrap{max-width:860px;margin:-30px auto 40px;background:white;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.1)}
.label{font-size:11px;font-weight:800;color:var(--azul);margin:18px 0 6px;display:block;text-transform:uppercase}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1.5px solid #e5e7eb}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toggle{display:flex;gap:10px}.toggle button{flex:1;padding:12px;border-radius:12px;border:1.5px solid #ddd;background:white;font-weight:700;cursor:pointer}.toggle button.active{background:var(--azul);color:white}
.btn{background:var(--azul);color:white;padding:16px;width:100%;border:none;border-radius:12px;font-weight:800;margin-top:16px;cursor:pointer}
.ok{display:none;text-align:center;padding:40px}.ok h2{color:var(--azul);font-size:32px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><div class="logo">DELI<span>PACK</span> | OUVIDORIA</div><div style="font-size:11px">CANAL SIGILOSO</div></div>
<div class="hero"><div><h1 style="font-size:44px;line-height:.9">Fale com<br>segurança.</h1><p style="margin:14px 0;opacity:.9">100% confidencial e protegido contra retaliação.</p></div><div style="background:white;color:#111;padding:18px;border-radius:16px"><b style="color:var(--azul)">Pode relatar:</b><ul style="margin:8px 0 0 18px;font-size:13px;line-height:1.9"><li>Denúncia / Assédio</li><li>Reclamação / Sugestão</li></ul></div></div>
<div class="form-wrap" id="formArea"><h2 style="color:var(--azul)">Novo relato</h2>
<label class="label">Se identificar?</label><div class="toggle"><button id="bA" class="active" onclick="setAnon(true)">🕵️ ANÔNIMO</button><button id="bI" onclick="setAnon(false)">🙋 IDENTIFICAR</button></div>
<div id="ident" style="display:none"><div class="grid2"><div><label class="label">Nome *</label><input id="nome"></div><div><label class="label">Setor *</label><select id="setor"><option>Produção</option><option>Logística</option><option>Administrativo</option><option>Comercial</option><option>Qualidade</option></select></div></div><label class="label">Contato *</label><input id="contato"></div>
<label class="label">Tipo *</label><select id="tipo" onchange="chg()"><option>Denúncia</option><option>Reclamação</option><option>Assédio Moral / Sexual</option><option>Sugestão</option><option>Elogio</option><option>Dúvida</option></select>
<div id="gravBox"><label class="label">Gravidade *</label><select id="gravidade"><option>Média</option><option>Alta</option><option>Urgente - Risco imediato</option><option>Baixa</option></select></div>
<div class="grid2"><div><label class="label">Data ocorrido</label><input type="date" id="dataOcorrido"></div><div><label class="label">Local</label><input id="local" placeholder="Ex: Expedição"></div></div>
<label class="label">Descrição *</label><textarea id="desc" rows="5" placeholder="Descreva o fato..."></textarea>
<button class="btn" id="btnSend" onclick="enviar()">ENVIAR COM SEGURANÇA →</button></div>
<div class="form-wrap ok" id="okArea"><div style="font-size:60px">✅</div><h2>Relato enviado!</h2><p style="color:#666;margin:12px 0">Avaliaremos com sigilo total. Obrigado por ajudar a Delipack.</p><button class="btn" onclick="location.reload()" style="max-width:280px">Novo relato</button></div>
<script>
let anon=true; function setAnon(v){anon=v;bA.classList.toggle('active',v);bI.classList.toggle('active',!v);ident.style.display=v?'none':'block'}
function chg(){gravBox.style.display=['Sugestão','Elogio','Dúvida'].includes(tipo.value)?'none':'block'} chg();
async function enviar(){
 if(desc.value.length<15) return alert('Descreva melhor');
 if(!anon && (!nome.value||!contato.value)) return alert('Preencha nome e contato');
 btnSend.disabled=true; btnSend.textContent='Enviando...';
 const r = await fetch('/api/relatos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
  data_br:new Date().toLocaleString('pt-BR'), anonimo:anon, nome:anon?'ANÔNIMO':nome.value, setor:anon?'Não informado':setor.value,
  contato:anon?'Anônimo':contato.value, tipo:tipo.value, gravidade:gravBox.style.display=='none'?'Não se aplica':gravidade.value,
  local:local.value, data_ocorrido:dataOcorrido.value, descricao:desc.value, status:'Novo'
 })});
 if(!r.ok){ const e=await r.json(); alert(e.error); btnSend.disabled=false; btnSend.textContent='ENVIAR COM SEGURANÇA →'; return; }
 formArea.style.display='none'; okArea.style.display='block';
}
</script></body></html>
