<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Gerencial - Dra Bruna Giacomazzi</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--vinho:#6A1B2A;--creme:#FFF8F5;--dourado:#D4AF7A}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--creme);font-family:Montserrat,sans-serif}
header{background:white;padding:16px 4%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.logo{font-family:Cormorant Garamond;font-weight:700;color:var(--vinho);font-size:22px}
.btn{padding:10px 18px;border-radius:20px;border:none;cursor:pointer;font-weight:600}
.btn-vinho{background:var(--vinho);color:white}
.layout{display:grid;grid-template-columns:1fr 380px;gap:20px;padding:20px 4%}
.card{background:white;border-radius:18px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
h2{font-family:Cormorant Garamond;color:var(--vinho);font-size:28px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:10px;border-bottom:1px solid #eee;text-align:left} th{background:var(--vinho);color:white}
.chat-box{position:sticky;top:90px;height:85vh;display:flex;flex-direction:column;border:2px solid var(--vinho);overflow:hidden}
.chat-header{background:var(--vinho);color:white;padding:14px;text-align:center}
.chat-msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#FFF8F5}
.msg{padding:10px 14px;border-radius:14px;max-width:85%;font-size:13px;line-height:1.4}
.bot{background:white;border:1px solid #eee;align-self:flex-start;border-bottom-left-radius:2px}
.user{background:var(--vinho);color:white;align-self:flex-end;border-bottom-right-radius:2px}
.chat-input{display:flex;gap:8px;padding:10px;background:white;border-top:1px solid #eee}
.chat-input input,.chat-input select{flex:1;padding:10px;border-radius:10px;border:1px solid #ddd}
.tag{padding:3px 8px;border-radius:10px;font-size:10px;background:#eee}
.tag.ocupado{background:#ffdddd;color:#a00}
.horarios{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.horarios button{padding:8px;border-radius:8px;border:1px solid var(--vinho);background:white;cursor:pointer;font-size:12px}
.horarios button:disabled{background:#ddd;border-color:#ddd;cursor:not-allowed}
.horarios button.livre:hover{background:var(--vinho);color:white}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.chat-box{height:70vh;position:relative;top:0}}
</style>
</head>
<body>
<header>
<div class="logo">DRA. BRUNA GIACOMAZZI • PAINEL GERENCIAL</div>
<div style="display:flex;gap:10px"><button class="btn" onclick="exportar()">Exportar</button><button class="btn btn-vinho" onclick="document.getElementById('clientView').scrollIntoView({behavior:'smooth'})">Ver como Cliente</button></div>
</header>

<div class="layout">
<div class="card">
<h2>Agendamentos - Controle Total</h2>
<p style="font-size:12px;color:#777;margin-bottom:12px">Horário funcionamento: Seg-Sex 08:00-17:00 | Intervalo 30min | Cada horário ocupado some para todos.</p>
<table id="tabelaGerencial"><thead><tr><th>CPF</th><th>Nome</th><th>Serviço</th><th>Data/Hora</th><th>Status</th><th>Ação</th></tr></thead><tbody></tbody></table>
</div>

<div class="card chat-box" id="clientView">
<div class="chat-header"><b>Secretária Virtual BG</b><br><span style="font-size:11px;opacity:.8">Link que você envia pro cliente</span></div>
<div class="chat-msgs" id="msgs"></div>
<div class="chat-input"><input id="inputChat" placeholder="Digite seu CPF..."><button class="btn btn-vinho" id="btnEnviar">Enviar</button></div>
</div>
</div>

<script>
// CONFIG
const INICIO = 8, FIM = 17; // 8h às 17h
const SERVICOS = ["Dentista", "Harmonização", "Avaliação"];
const STORAGE_KEY = "bg_agenda_v2";

let estado = { etapa: "cpf", cpf:"", nome:"", servico:"", data:"", hora:"" };
let clienteLogado = null;

function getAgenda(){ return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); }
function saveAgenda(arr){ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); renderGerencial(); }

function isWeekend(dateStr){ const d=new Date(dateStr+"T12:00:00"); return d.getDay()==0||d.getDay()==6; }
function getHorariosOcupados(data){ return getAgenda().filter(a=>a.data==data && a.status!="cancelado").map(a=>a.hora); }

function gerarDatas(){ let datas=[]; let hoje=new Date(); for(let i=0;i<20;i++){ let d=new Date(); d.setDate(hoje.getDate()+i); let iso=d.toISOString().slice(0,10); if(!isWeekend(iso)) datas.push(iso); } return datas; }

function renderGerencial(){
 const tb=document.querySelector("#tabelaGerencial tbody"); const ag=getAgenda().sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
 tb.innerHTML=""; ag.forEach((a,i)=>{
   tb.innerHTML+=`<tr><td>${a.cpf}</td><td>${a.nome}</td><td>${a.servico}</td><td>${a.data} ${a.hora}</td><td><span class="tag ${a.status=="cancelado"?"ocupado":""}">${a.status}</span></td><td>${a.status!="cancelado"?`<button onclick="cancelar('${a.cpf}','${a.data}','${a.hora}')">Cancelar</button>`:"-"}</td></tr>`;
 });
}

function cancelar(cpf,data,hora){
 let ag=getAgenda(); let idx=ag.findIndex(x=>x.cpf==cpf && x.data==data && x.hora==hora && x.status!="cancelado");
 if(idx>=0){ ag[idx].status="cancelado"; saveAgenda(ag); botMsg(`Agendamento de ${ag[idx].nome} em ${data} ${hora} cancelado pela Dra/Letícia.`); }
}

function botMsg(txt){
 const div=document.createElement("div"); div.className="msg bot"; div.innerHTML=txt; document.getElementById("msgs").appendChild(div);
 document.getElementById("msgs").scrollTop=9999;
}
function userMsg(txt){
 const div=document.createElement("div"); div.className="msg user"; div.textContent=txt; document.getElementById("msgs").appendChild(div);
}

function iniciarChat(){
 botMsg(`Olá! Sou a secretária virtual da Dra. Bruna Giacomazzi 🦷✨<br><br>Para agendar, digite seu <b>CPF</b> (só números).<br>Se já tem cadastro, vou te reconhecer.`);
}

function fluxo(texto){
 const input = texto.trim();
 if(estado.etapa=="cpf"){
   if(input.length<11){ botMsg("CPF inválido. Digite 11 números."); return; }
   estado.cpf=input; let ag=getAgenda().filter(a=>a.cpf==input && a.status!="cancelado");
   let cadastro = getAgenda().find(a=>a.cpf==input);
   if(ag.length>0){
     clienteLogado={cpf:input, nome:cadastro.nome, agendamentos:ag};
     botMsg(`Olá ${cadastro.nome}! Vi que você já tem ${ag.length} agendamento(s).<br><br>${ag.map(a=>`📅 <b>${a.data} ${a.hora}</b> - ${a.servico} <button onclick="cancelar('${a.cpf}','${a.data}','${a.hora}')">Cancelar</button>`).join("<br>")}<br><br>Quer <b>AGENDAR NOVO</b> ou <b>REAGENDAR</b>? Digite: NOVO ou REAGENDAR`);
     estado.etapa="logado_opcao"; return;
   }
   if(cadastro){ estado.nome=cadastro.nome; botMsg(`Bem-vinda de volta, ${estado.nome}! Qual serviço você quer?<br><b>1</b> - Dentista<br><b>2</b> - Harmonização<br><b>3</b> - Avaliação`); estado.etapa="servico"; }
   else { botMsg("CPF novo! Qual seu nome completo?"); estado.etapa="nome"; }
 }
 else if(estado.etapa=="nome"){ estado.nome=input; botMsg(`Prazer, ${estado.nome}! Escolha o serviço:<br><b>1</b> - Dentista<br><b>2</b> - Harmonização<br><b>3</b> - Avaliação<br><br><i>Obs: valores só após avaliação presencial.</i>`); estado.etapa="servico"; }
 else if(estado.etapa=="logado_opcao"){
   if(input.toUpperCase().includes("NOVO")){ botMsg("Qual serviço? <b>1</b>-Dentista <b>2</b>-Harmonização <b>3</b>-Avaliação"); estado.etapa="servico"; }
   else if(input.toUpperCase().includes("REAGENDAR")){ botMsg("Para reagendar, primeiro cancele o horário antigo clicando em Cancelar acima, depois digite NOVO."); }
 }
 else if(estado.etapa=="servico"){
   let idx=parseInt(input)-1; if(input.toLowerCase().includes("dent")) idx=0; if(input.toLowerCase().includes("harm")) idx=1; if(input.toLowerCase().includes("aval")) idx=2;
   estado.servico=SERVICOS[idx]||SERVICOS[0];
   let datas=gerarDatas(); let html=`Serviço: <b>${estado.servico}</b><br>Escolha uma data disponível (Seg-Sex):<br><div class="horarios">`+datas.map(d=>`<button onclick="escolherData('${d}')">${d.split("-").reverse().join("/")}</button>`).join("")+`</div>`;
   botMsg(html); estado.etapa="data";
 }
}

function escolherData(data){
 estado.data=data; userMsg(data.split("-").reverse().join("/"));
 let ocupados=getHorariosOcupados(data); let html=`Data: <b>${data}</b><br>Horários (30min) das 08:00 às 17:00:<br><div class="horarios">`;
 for(let h=INICIO; h<FIM; h++){ for(let m of [0,30]){ let hora=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`; let ocupado=ocupados.includes(hora); html+=`<button class="${ocupado?"":"livre"}" ${ocupado?"disabled":""} onclick="escolherHora('${hora}')">${hora} ${ocupado?"(ocupado)":""}</button>`; } }
 html+=`</div>`; botMsg(html); estado.etapa="hora";
}
function escolherHora(hora){
 estado.hora=hora; userMsg(hora);
 let novo={cpf:estado.cpf, nome:estado.nome, servico:estado.servico, data:estado.data, hora:estado.hora, status:"confirmado", criado:new Date().toISOString()};
 let ag=getAgenda(); ag.push(novo); saveAgenda(ag);
 botMsg(`✅ <b>Agendado!</b><br>Nome: ${estado.nome}<br>CPF: ${estado.cpf}<br>Serviço: ${estado.servico}<br>Quando: ${estado.data} às ${estado.hora}<br><br>Os valores serão definidos na avaliação presencial.<br><br>Você pode voltar aqui a qualquer momento digitando seu CPF para <b>consultar, cancelar ou reagendar</b>.`);
 estado={etapa:"cpf", cpf:"", nome:"", servico:"", data:"", hora:""};
}

document.getElementById("btnEnviar").onclick=()=>{
 let v=document.getElementById("inputChat").value; if(!v) return; userMsg(v); fluxo(v); document.getElementById("inputChat").value="";
};
document.getElementById("inputChat").addEventListener("keydown", e=>{ if(e.key=="Enter") document.getElementById("btnEnviar").click(); });

function exportar(){ let dados=localStorage.getItem(STORAGE_KEY); let blob=new Blob([dados],{type:"application/json"}); let a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="agenda_bruna.json"; a.click(); }

renderGerencial(); iniciarChat();
</script>
</body>
</html>
