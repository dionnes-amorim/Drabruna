<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ouvidoria Delipack</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#0B2A4A;--verde:#00C896}*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#F5F7FA}
.top{background:rgba(255,255,255,.9);backdrop-filter:blur(12px);padding:10px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;color:var(--azul);font-size:16px}
.logo img{height:38px!important;width:auto!important;max-width:140px;object-fit:contain;display:block}
.hero{background:linear-gradient(135deg,var(--azul),#123c6a);color:white;padding:50px 5%;display:grid;grid-template-columns:1.2fr .8fr;gap:20px}
.form-wrap{max-width:860px;margin:-30px auto 40px;background:white;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.1)}
.label{font-size:11px;font-weight:800;color:var(--azul);margin:18px 0 6px;display:block;text-transform:uppercase}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1.5px solid #e5e7eb;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--azul)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle{display:flex;gap:10px;width:100%}
.toggle button{flex:1;padding:12px 10px;border-radius:12px;border:1.5px solid #ddd;background:white;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap}
.toggle button.active{background:var(--azul);color:white;border-color:var(--azul)}
.btn{background:var(--azul);color:white;padding:16px;width:100%;border:none;border-radius:12px;font-weight:800;margin-top:16px;cursor:pointer;font-size:15px}
.ok{display:none;text-align:center;padding:40px}
.ok h2{color:var(--azul);font-size:32px}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding:30px 5%}.grid2{grid-template-columns:1fr}.hero h1{font-size:36px!important}}
</style>
</head>
<body>

<div class="top">
  <div class="logo">
    <img src="logo.png" alt="Deli Pack"> | OUVIDORIA
  </div>
  <div style="font-size:11px;letter-spacing:1px;font-weight:700;opacity:.6">CANAL SIGILOSO</div>
</div>

<div class="hero">
  <div>
    <h1 style="font-size:44px;line-height:.9">Fale com<br>segurança.</h1>
    <p style="margin:14px 0;opacity:.9">100% confidencial e protegido contra retaliação.</p>
  </div>
  <div style="background:white;color:#111;padding:18px;border-radius:16px">
    <b style="color:var(--azul)">Pode relatar:</b>
    <ul style="margin:8px 0 0 18px;font-size:13px;line-height:1.9">
      <li>Denúncia / Assédio</li>
      <li>Reclamação / Sugestão / Elogio</li>
    </ul>
  </div>
</div>

<div class="form-wrap" id="formArea">
<h2 style="color:var(--azul)">Novo relato</h2>

<label class="label">Se identificar?</label>
<div class="toggle">
  <button id="bA" class="active" onclick="setAnon(true)">🕵️ ANÔNIMO</button>
  <button id="bI" onclick="setAnon(false)">🙋 IDENTIFICAR</button>
</div>

<div id="ident" style="display:none">
  <div class="grid2"><div><label class="label">Nome *</label><input id="nome"></div><div><label class="label">Setor *</label><select id="setor"><option>Produção</option><option>Logística</option><option>Administrativo</option><option>Comercial</option><option>Qualidade</option><option>Outro</option></select></div></div>
  <label class="label">Contato *</label><input id="contato" placeholder="WhatsApp ou e-mail">
</div>

<label class="label">Tipo *</label>
<select id="tipo" onchange="chg()"><option>Denúncia</option><option>Reclamação</option><option>Assédio Moral / Sexual</option><option>Sugestão</option><option>Elogio</option><option>Dúvida</option></select>

<div id="gravBox"><label class="label">Gravidade *</label><select id="gravidade"><option>Média</option><option>Alta</option><option>Urgente - Risco imediato</option><option>Baixa</option></select></div>

<div class="grid2"><div><label class="label">Data ocorrido</label><input type="date" id="dataOcorrido"></div><div><label class="label">Local</label><input id="local" placeholder="Ex: Expedição"></div></div>

<label class="label">Descrição *</label><textarea id="desc" rows="5" placeholder="Descreva o fato com o máximo de detalhes..."></textarea>
<button class="btn" id="btnSend" onclick="enviar()">ENVIAR COM SEGURANÇA →</button>
<p id="erro" style="color:red;font-size:12px;margin-top:10px;text-align:center"></p>
</div>

<div class="form-wrap ok" id="okArea"><div style="font-size:60px">✅</div><h2>Relato enviado!</h2><p style="color:#666;margin:12px 0">Avaliaremos com sigilo total. Obrigado por ajudar a Delipack.</p><button class="btn" onclick="location.reload()" style="max-width:280px">Novo relato</button></div>

<script>
let anon = true;
function setAnon(v){
  anon = v;
  document.getElementById('bA').classList.toggle('active', v);
  document.getElementById('bI').classList.toggle('active', !v);
  document.getElementById('ident').style.display = v ? 'none' : 'block';
}
function chg(){
  let t = document.getElementById('tipo').value;
  // esconde gravidade para elogio/sugestão que não precisa
  document.getElementById('gravBox').style.display = (t==='Elogio' || t==='Sugestão') ? 'none' : 'block';
}
async function enviar(){
  const btn = document.getElementById('btnSend');
  const erro = document.getElementById('erro');
  const desc = document.getElementById('desc').value.trim();
  if(!desc){ erro.textContent='Descreva o fato'; return; }
  if(!anon){
    if(!document.getElementById('nome').value.trim() || !document.getElementById('contato').value.trim()){
      erro.textContent='Preencha nome e contato ou escolha ANÔNIMO'; return;
    }
  }
  btn.textContent='Enviando...'; btn.disabled=true; erro.textContent='';
  try{
    const payload = {
      anonimo: anon,
      nome: document.getElementById('nome').value.trim(),
      setor: document.getElementById('setor').value,
      contato: document.getElementById('contato').value.trim(),
      tipo: document.getElementById('tipo').value,
      gravidade: document.getElementById('gravidade').value,
      data_ocorrido: document.getElementById('dataOcorrido').value,
      local: document.getElementById('local').value.trim(),
      descricao: desc,
      data_br: new Date().toLocaleString('pt-BR')
    };
    const r = await fetch('/api/relatos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok) throw new Error();
    document.getElementById('formArea').style.display='none';
    document.getElementById('okArea').style.display='block';
  }catch(e){
    erro.textContent='Erro ao enviar. Tente novamente em 10s (servidor Render acordando)';
    btn.textContent='ENVIAR COM SEGURANÇA →'; btn.disabled=false;
  }
}
chg();
</script>
</body></html>
